name: Build Noor (Flutter — Android + iOS)

# How this works: this repo only commits the Flutter *application* code
# (pubspec.yaml, lib/, assets/) — not the generated android/ and ios/
# platform folders. Those are regenerated fresh by `flutter create` on
# every run (step below), then patched to the app's real identifiers
# (fr.noor.app) and signing config. This avoids hand-maintaining fragile,
# mostly-boilerplate native scaffolding by hand, and keeps it always in
# sync with whatever Flutter version this workflow installs.
#
# Android and iOS are two separate, parallel jobs rather than one job
# doing both: `flutter build ios` only works with Xcode, which only
# exists on a macOS runner — it cannot run on the same ubuntu-latest
# runner that builds the Android App Bundle/APK. Splitting them also
# means an iOS-only failure no longer blocks the Android build (or
# vice versa), and the (much pricier) macOS runner is only used for
# the iOS job.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_ID: fr.noor.app   # MUST stay exactly this — it's the applicationId
                         # already published on the Play Store (Tests
                         # internes track). Changing it would make Google
                         # Play treat this as a brand new, unrelated app.

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the android/ platform project
        # --org fr.noor + --project-name app => applicationId "fr.noor.app",
        # matching $APP_ID above. Since pubspec.yaml, lib/ and assets/
        # already exist in the repo, flutter create does NOT overwrite
        # them — it only fills in the missing platform folder.
        run: flutter create --platforms=android --org fr.noor --project-name app .

      - name: Fetch Dart/Flutter package dependencies
        run: flutter pub get

      - name: Generate the real app launcher icon (flutter create resets it to the default Flutter icon every run)
        run: dart run flutter_launcher_icons

      - name: Run static analysis (non-blocking for now)
        run: flutter analyze || echo "::warning::flutter analyze reported issues — see above."

      - name: Set the Android app label to "Noor" (defaults to "app" from --project-name)
        run: |
          python3 - <<'PYEOF2'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          content = re.sub(r'android:label="[^"]*"', 'android:label="Noor"', content)
          with open(path, 'w') as f:
              f.write(content)
          print('Patched AndroidManifest.xml label')
          PYEOF2

      - name: Force the Android applicationId / namespace to fr.noor.app
        run: |
          python3 - <<'PYEOF'
          import re, glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path) as f:
                  content = f.read()
              content = re.sub(r'''(applicationId\s*=?\s*)['"][^'"]+['"]''', r'\1"fr.noor.app"', content)
              content = re.sub(r'''(namespace\s*=?\s*)['"][^'"]+['"]''', r'\1"fr.noor.app"', content)
              with open(path, 'w') as f:
                  f.write(content)
              print(f'Patched {path}')
          PYEOF

      - name: Enable core library desugaring (required by flutter_local_notifications)
        # flutter_local_notifications' Android backend needs Java 8+ desugared
        # APIs (java.time etc.) on API levels below 26. Without this, Gradle's
        # checkReleaseAarMetadata task fails the build outright.
        run: |
          python3 - <<'PYEOF'
          import re, glob, sys

          candidates = glob.glob('android/app/build.gradle.kts') or glob.glob('android/app/build.gradle')
          if not candidates:
              sys.exit('No android/app/build.gradle(.kts) found')
          path = candidates[0]
          kotlin = path.endswith('.kts')
          with open(path) as f:
              content = f.read()

          # Rather than trying to locate (and possibly mis-match) an existing
          # `dependencies { ... }` block — the exact template shape has
          # already changed between Flutter versions — just append a fresh
          # one at the end of the file. Gradle (both DSLs) is happy to see
          # `dependencies { ... }` invoked more than once in the same script.
          if kotlin:
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      content, count=1,
                  )
              if 'coreLibraryDesugaring(' not in content:
                  content += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r"\1\n        coreLibraryDesugaringEnabled true",
                      content, count=1,
                  )
              if "coreLibraryDesugaring '" not in content:
                  content += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          with open(path, 'w') as f:
              f.write(content)
          print(f'Enabled core library desugaring in {path}')
          PYEOF

      - name: Add the permissions the app's modules need (location, internet)
        # Location: mosque search / prayer-time geolocation. INTERNET: kept
        # for future Quran text/audio (Al Quran Cloud API), harmless now.
        # The notification-related permissions (POST_NOTIFICATIONS,
        # RECEIVE_BOOT_COMPLETED, SCHEDULE_EXACT_ALARM) were removed along
        # with flutter_local_notifications — see pubspec.yaml — add them
        # back together with that plugin once adhan reminders are built.
        run: |
          python3 - <<'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          '''
          if 'ACCESS_FINE_LOCATION' not in content:
              content = content.replace('<application', perms + '    <application', 1)
          with open(path, 'w') as f:
              f.write(content)
          print('Patched AndroidManifest.xml permissions')
          PYEOF

      - name: Decode the Android signing key
        # Same keystore/secrets already used by the previous (Capacitor)
        # build — reusing it is required, not optional: the Play Store
        # ties app updates to the signing key, not the build tool.
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Wire the signing key into the Android build
        # Two stable anchors are used instead of a full rewrite, since they
        # hold across Flutter template versions: the "android {" opening
        # (to insert the keystore loader + a "release" signingConfig right
        # after it), and the auto-generated "sign release builds with the
        # debug key for now" line inside buildTypes.release (swapped to
        # point at our new "release" signingConfig instead).
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release.keystore
          EOF
          python3 - <<'PYEOF'
          import re, glob, sys

          candidates = glob.glob('android/app/build.gradle.kts') or glob.glob('android/app/build.gradle')
          if not candidates:
              sys.exit('No android/app/build.gradle(.kts) found')
          path = candidates[0]
          kotlin = path.endswith('.kts')
          with open(path) as f:
              content = f.read()

          if kotlin:
              # `java.util.Properties()` / `java.io.FileInputStream(...)` look
              # safe, but Gradle's Kotlin DSL script accessors shadow the
              # top-level `java` identifier for Android app modules (it
              # becomes a `JavaPluginExtension` accessor instead of the java.*
              # package), which breaks the dotted reference with "Unresolved
              # reference 'util'"/"'io'". Importing the classes explicitly and
              # using their bare names sidesteps that shadowing entirely.
              if 'import java.util.Properties' not in content:
                  content = 'import java.util.Properties\nimport java.io.FileInputStream\n' + content
              loader = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
              signing_configs = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              content = content.replace('android {', loader + '\nandroid {', 1)
              content = re.sub(r'(android\s*\{)', r'\1\n' + signing_configs, content, count=1)
              content = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  content,
              )
          else:
              loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              signing_configs = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              content = loader + '\n' + content
              content = re.sub(r'(android\s*\{)', r'\1\n' + signing_configs, content, count=1)
              content = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  content,
              )

          with open(path, 'w') as f:
              f.write(content)
          print(f'Wired release signing into {path}')
          PYEOF

      - name: Build the signed Android App Bundle (.aab) and .apk
        # versionCode must strictly increase on every Play Store upload, and
        # pubspec.yaml's build number (currently +1) collides with codes
        # already used by earlier (pre-Flutter-rewrite) uploads. Deriving it
        # from the ever-increasing GitHub Actions run number instead means
        # every future build gets a fresh, unique code automatically — no
        # more manual bumping. +100 offset gives headroom above the highest
        # code already used in Play Console (13 as of this change).
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "Using versionCode $BUILD_NUMBER"
          flutter build appbundle --release --build-number=$BUILD_NUMBER
          flutter build apk --release --build-number=$BUILD_NUMBER

      - name: Upload the Android build results to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: noor-android-build
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the ios/ platform project
        run: flutter create --platforms=ios --org fr.noor --project-name app .

      - name: Fetch Dart/Flutter package dependencies
        run: flutter pub get

      - name: Generate the real app launcher icon (flutter create resets it to the default Flutter icon every run)
        run: dart run flutter_launcher_icons

      - name: Force the iOS bundle identifier to fr.noor.app
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = fr.noor.app;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Add the iOS location permission description (required by geolocator)
        # iOS refuses to even show the location permission prompt without a
        # usage description string in Info.plist — without this, requesting
        # the user's position (Prières screen) would silently fail/crash.
        # ios/ is regenerated fresh every run (see top of file), so this has
        # to be patched back in each time, same as the Android manifest.
        run: |
          python3 - <<'PYEOF2'
          import re
          path = 'ios/Runner/Info.plist'
          with open(path) as f:
              content = f.read()
          if 'NSLocationWhenInUseUsageDescription' not in content:
              addition = (
                  '\t<key>NSLocationWhenInUseUsageDescription</key>\n'
                  '\t<string>Noor utilise ta position pour calculer les horaires de '
                  'pri\u00e8re et trouver les mosqu\u00e9es proches de toi.</string>\n'
              )
              content = re.sub(r'(</dict>\s*</plist>\s*)$', addition + r'\1', content)
              with open(path, 'w') as f:
                  f.write(content)
              print('Patched Info.plist with NSLocationWhenInUseUsageDescription')
          else:
              print('Info.plist already has NSLocationWhenInUseUsageDescription')
          PYEOF2

      - name: Build an unsigned iOS app (verifies it compiles — signing comes once an Apple Developer account is configured)
        run: flutter build ios --release --no-codesign

      - name: Upload the iOS build result to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: noor-ios-build
          path: build/ios/iphoneos/*.app
          if-no-files-found: error

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download the Android build artifact (.aab/.apk)
        uses: actions/download-artifact@v4
        with:
          name: noor-android-build
          path: artifacts/android

      - name: Download the iOS build artifact (.app)
        uses: actions/download-artifact@v4
        with:
          name: noor-ios-build
          path: artifacts/ios

      - name: Zip the iOS .app bundle (a release asset must be a single file)
        run: |
          cd artifacts/ios
          zip -r ../ios-app.zip .

      - name: Flatten the Android outputs (download-artifact keeps the original nested build/ path)
        run: |
          mkdir -p release-assets
          find artifacts/android -name '*.aab' -exec cp {} release-assets/ \;
          find artifacts/android -name '*.apk' -exec cp {} release-assets/ \;
          cp artifacts/ios-app.zip release-assets/
          ls -la release-assets/

      - name: Create a GitHub Release with the build outputs attached
        # This is what makes a downloadable Release show up on the repo's
        # Releases page, separate from (and longer-lived than) the
        # workflow-run artifacts above, which expire after 90 days and are
        # only reachable from the Actions tab.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "Build automatique depuis le commit ${{ github.sha }}."
          files: release-assets/*
