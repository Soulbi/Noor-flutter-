name: noor
description: "Noor — horaires de prière, jours de jeûne recommandés, Coran et mosquées à proximité."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistence — mirrors localStorage usage in the web app (settings,
  # selected mosque, reading position, etc.)
  shared_preferences: ^2.3.3

  # Device location, for prayer-time calculation and mosque search.
  geolocator: ^13.0.2

  # Native notifications, scheduled days ahead so they survive the app
  # being closed — same role @capacitor/local-notifications played in the
  # Android build this replaces.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Adhan audio playback at prayer time.
  audioplayers: ^6.1.0

  # Android home screen widget (today's prayer times without opening the app).
  home_widget: ^0.7.0

  # Quran Arabic/French/English text + recitation audio (Al Quran Cloud API),
  # same source the web app already uses.
  http: ^1.2.2

  # Fonts matching the current app (Fraunces, Public Sans, Noto Naskh Arabic).
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/mosques-france.json
