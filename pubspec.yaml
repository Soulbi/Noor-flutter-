name: noor
description: "Noor — horaires de prière, jours de jeûne recommandés, Coran et mosquées à proximité."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistence — mirrors localStorage usage in the web app (settings,
  # selected mosque, reading position, etc.)
  shared_preferences: ^2.3.3

  # Device location, for prayer-time calculation and mosque search.
  geolocator: ^13.0.2

  # Fonts matching the current app (Fraunces, Public Sans, Noto Naskh Arabic).
  google_fonts: ^6.2.1

  # --- Planned, not yet wired into any screen — removed for now. ---
  # Each of these pulls in its own native Android registration code
  # (WorkManager + Glance widgets for notifications, AppWidgetProvider for
  # the home-screen widget, native media players for audio) for zero
  # current benefit, which is unnecessary risk while diagnosing a
  # crash-on-launch report. Add each back individually, one at a time, once
  # it is actually implemented and can be tested in isolation:
  #   flutter_local_notifications: ^18.0.1   # adhan reminders
  #   timezone: ^0.9.4                        # used alongside the above
  #   audioplayers: ^6.1.0                    # adhan audio playback
  #   home_widget: ^0.7.0                     # home-screen widget
  #   http: ^1.2.2                            # Quran text/audio (Al Quran Cloud API)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/mosques-france.json
